packages:
  # grizzle's packages by name, and each experiment, which is a package of its own until its verdict deletes it
  # (packages/experiments/<name>); never the directory that holds the experiments.
  - packages/engine
  - packages/grizzle
  - packages/pg
  - "packages/experiments/*"
  # The toolchain, the submodule pinned at its commit: its dev tools and testing library join the workspace and run from
  # source, with their own gate, none of grizzle's.
  - vendor/toolchain/packages/devtools
  - vendor/toolchain/packages/limit
  - vendor/toolchain/packages/limits
  - vendor/toolchain/packages/testing
# Approved dependencies' agent skills link into the one skills folder, which .claude/skills and .cursor/skills link to.
skills:
  dirs:
    - .agents/skills
catalogMode: strict
# No dependency's install script runs. lefthook's would install the git hooks, which the root's prepare does instead, on
# every install.
allowBuilds:
  lefthook: false
# Admit a release once it is a day old.
minimumReleaseAge: 1440
# Node 26 is the floor, so its types are the only Node types, even for packages that ask for newer: code typed against
# 26 runs on 26 and every Node after it.
overrides:
  "@types/node": "catalog:"
catalog:
  "@aws-sdk/rds-signer": 3.1169.0
  "@clerk/backend": 3.29.0
  "@effect/language-service": 0.87.5
  "@effect/platform-node": 4.1.4
  "@effect/tsgo": 0.69.0
  "@effect/vitest": 4.1.4
  "@hyperjump/json-schema": 1.18.0
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  "@vercel/functions": 3.11.3
  arkregex: 0.0.14
  effect: 4.1.4
  eslint-plugin-better-tailwindcss: 4.11.0
  fallow: 3.43.0
  lefthook: 2.2.2
  oxfmt: 0.78.0
  oxlint-tsgolint: 7.0.2007
  oxlint: 1.93.0
  pg: 8.23.1
  turbo: 2.11.11
  typescript: 7.1.0-beta
  vite: 8.3.8
  vitest: 5.1.0
permissions:
  fallow:
    skills: true
