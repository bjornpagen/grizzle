packages:
  - "packages/*"
  # The toolchain, the submodule pinned at its commit: its dev tools and testing library join the workspace and run from
  # source, with their own gate, none of grizzle's.
  - vendor/toolchain/packages/devtools
  - vendor/toolchain/packages/testing
# Approved dependencies' agent skills link into the one skills folder, which .claude/skills and .cursor/skills link to.
skills:
  dirs:
    - .agents/skills
catalogMode: strict
# Admit a release once it is a day old.
minimumReleaseAge: 1440
# Node 26 is the floor, so its types are the only Node types, even for packages that ask for newer: code typed against
# 26 runs on 26 and every Node after it.
overrides:
  "@types/node": "catalog:"
catalog:
  "@aws-sdk/rds-signer": 3.1161.0
  "@babel/core": 7.29.7
  "@clerk/backend": 3.26.6
  "@effect/platform-node": 4.1.2
  "@effect/tsgo": 0.67.1
  "@effect/vitest": 4.1.2
  "@hyperjump/json-schema": 1.18.0
  "@tailwindcss/node": 4.3.4
  "@types/babel__core": 7.20.5
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  "@vercel/functions": 3.10.6
  arkregex: 0.0.14
  babel-plugin-react-compiler: 1.0.0
  effect: 4.1.2
  fallow: 3.38.1
  oxfmt: 0.76.0
  oxlint-tsgolint: 7.0.2005
  oxlint: 1.91.0
  pg: 8.23.1
  turbo: 2.11.10
  typescript: 7.1.0-beta
  vite: 8.3.5
  vitest: 5.1.0
permissions:
  fallow:
    skills: true
