packages:
  - packages/*
  # grizzle, the submodule pinned at its commit: its packages join the workspace and run from source, as every consumer
  # takes them, and its own gate proves them. The grizzle tier (packages/generator/test/grizzle) installs a login through
  # its command line, serves it through its public API and reaches its local cluster through grizzle-pg's pin.
  - vendor/grizzle/packages/engine
  - vendor/grizzle/packages/grizzle
  - vendor/grizzle/packages/pg
  - vendor/grizzle/packages/text
  # The toolchain, the submodule pinned at its commit: its dev tools and testing library join the workspace and run from
  # source, and its own gate proves them.
  - vendor/toolchain/packages/devtools
  - vendor/toolchain/packages/testing
nodeLinker: hoisted
verifyDepsBeforeRun: error
# A dependency is written at the exact version installed, and an engine a package refuses fails the install.
saveExact: true
engineStrict: true
# Node 26 is the one runtime, so its types are the only Node types, even for packages that ask for another.
overrides:
  "@types/node": "catalog:"
allowBuilds:
  lefthook: true
  "@tailwindcss/oxide": true
  esbuild: true
# Approved dependencies' agent skills link into the one skills folder.
skills:
  dirs:
    - .agents/skills
# Admit a release once it is a day old.
minimumReleaseAge: 1440
# Every external dependency's one version: packages name it with catalog:, and strict mode refuses a version stated anywhere else.
catalogMode: strict
catalog:
  "@effect/platform-node": 4.1.4
  "@effect/tsgo": 0.69.0
  "@effect/vitest": 4.1.4
  "@hyperjump/json-schema": 1.18.0
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  arkregex: 0.0.14
  effect: 4.1.4
  eslint-plugin-better-tailwindcss: 4.11.0
  fallow: 3.43.1
  lefthook: 2.2.2
  oxfmt: 0.78.0
  tsrs: 0.25.0-ts7.1.0-beta
  oxlint: 1.93.0
  pg: 8.23.1
  turbo: 2.11.11
  typescript: 7.1.0-beta
  vite: 8.3.8
  vitest: 5.1.0
  yaml: 2.9.1
permissions:
  fallow:
    skills: true
