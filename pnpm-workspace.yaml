packages:
  - "packages/*"
allowBuilds:
  lefthook: true
catalogMode: strict
# Admit a release once it is a day old.
minimumReleaseAge: 1440
# Node 24 is the floor, so its types are the only Node types, even for packages that ask for newer: code typed against
# 24 runs on 24 and every Node after it.
overrides:
  "@types/node": "catalog:"
catalog:
  "@aws-sdk/rds-signer": 3.1158.0
  "@clerk/backend": 3.26.4
  "@effect/language-service": 0.87.5
  "@effect/platform-node": 4.0.7
  "@effect/tsgo": 0.63.0
  "@effect/vitest": 4.0.7
  "@types/node": 24.19.2
  "@types/pg": 8.23.1
  "@vercel/functions": 3.10.4
  arkregex: 0.0.14
  effect: 4.0.7
  fallow: 3.37.0
  lefthook: 2.2.2
  oxfmt: 0.75.0
  oxlint-tsgolint: 7.0.2005
  oxlint: 1.90.0
  pg: 8.23.1
  turbo: 2.11.10
  typescript: 7.1.0-beta
  vite: 8.3.5
  vitest: 5.0.5
